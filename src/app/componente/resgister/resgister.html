
<div class="login-container">
  <p-card header="Registrar Novo Usuário" styleClass="p-shadow-4 login-card">
    <form [formGroup]="formRegister" (ngSubmit)="cadastrar()" novalidate>

      <!-- Email -->
      <div class="p-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          placeholder="Digite seu email"
          autocomplete="email"
          [attr.aria-invalid]="formRegister.get('email')?.invalid && formRegister.get('email')?.touched"
          aria-describedby="email-erro"
        />
        <small
          id="email-erro"
          class="erro"
          *ngIf="formRegister.get('email')?.touched && formRegister.get('email')?.invalid"
        >
          Email obrigatório e válido.
        </small>
      </div>

      <!-- Senha -->
      <div class="p-field">
        <label for="senha">Senha</label>
        <p-password
          id="senha"
          formControlName="senha"
          placeholder="Digite sua senha"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [attr.aria-invalid]="formRegister.get('senha')?.invalid && formRegister.get('senha')?.touched"
          aria-describedby="senha-erro"
        >
        </p-password>
        <small
          id="senha-erro"
          class="erro"
          *ngIf="formRegister.get('senha')?.touched && formRegister.get('senha')?.invalid"
        >
          A senha deve conter pelo menos 6 caracteres.
        </small>
      </div>

      <!-- Confirmar Senha -->
      <div class="p-field">
        <label for="confirmarSenha">Confirmar Senha</label>
        <p-password
          id="confirmarSenha"
          formControlName="confirmarSenha"
          placeholder="Confirme sua senha"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [attr.aria-invalid]="(formRegister.get('confirmarSenha')?.invalid && formRegister.get('confirmarSenha')?.touched) || (formRegister.hasError('passwordMismatch') && formRegister.get('confirmarSenha')?.touched)"
          aria-describedby="confirmar-erro"
        >
        </p-password>
        <small
          id="confirmar-erro"
          class="erro"
          *ngIf="
            formRegister.get('confirmarSenha')?.touched &&
            (formRegister.get('confirmarSenha')?.invalid || formRegister.hasError('passwordMismatch'))
          "
        >
          As senhas devem coincidir.
        </small>
      </div>

      <!-- Botões -->
      <div class="btn-container">
        <p-button
          label="Registrar"
          icon="pi pi-user-plus"
          styleClass="p-button-success w-full"
          type="submit"
          [disabled]="formRegister.invalid"
        >
        </p-button>

        <!-- Link para login -->
        <div class="mt-3 text-center">
          <span>Já possui conta?</span>
          <a routerLink="/login" class="ml-1 link">
            Fazer login
          </a>
        </div>
      </div>

    </form>
  </p-card>
