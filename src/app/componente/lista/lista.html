
<div style="padding: 2rem;">
  <h1>Gerenciador de Tarefas</h1>

  <div class="card flex gap-2 mb-4">
    <input pInputText [(ngModel)]="novoTitulo" placeholder="Nova Tarefa..." />
    <p-button label="Adicionar" icon="pi pi-plus" (onClick)="salvar()"></p-button>
  </div>

  <table mat-table [dataSource]="tarefas" class="mat-elevation-z4" style="width:100%;">

    <!-- Título -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let tarefa">{{ tarefa.titulo }}</td>
    </ng-container>

    <!-- Status (select true/false) -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let tarefa">
        <div class="flex items-center gap-2">
          <!-- Select Material -->
          <mat-form-field appearance="outline" class="w-40">
            <mat-label>Status</mat-label>
            <mat-select
              [value]="tarefa.concluida"
              (selectionChange)="atualizarStatus(tarefa, $event.value)"
            >
              <mat-option [value]="true">Concluída (true)</mat-option>
              <mat-option [value]="false">Em aberto (false)</mat-option>
            </mat-select>
          </mat-form-field>

          <!-- Ícone visual de estado -->
          <i
            class="pi"
            [ngClass]="tarefa.concluida ? 'pi-check text-green-500' : 'pi-times text-red-500'"
            aria-label="Indicador de status"
          ></i>
        </div>
      </td>
    </ng-container>

    <!-- Ações (lixeira personalizada) -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let tarefa">
        <div class="flex items-center">
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [text]="true"
            class="btn-delete"
            (onClick)="confirmarExclusao ? confirmarDelete(tarefa) : deletar(tarefa.id)"
          ></p-button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>
